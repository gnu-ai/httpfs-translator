#
# Continuous integration on real GNU/Hurd.
#
# The GitHub runner boots the official Debian GNU/Hurd preinstalled
# image inside QEMU.  A small boot ISO (built by make_iso.py + the
# grub-mkimage early config) gives the machine a serial console
# (console=com0), turning it into a fully headless, scriptable
# system: the driver logs in as root over the serial line and runs
# the full build + test suite + the settrans smoke test inside the
# Hurd.

name: hurd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The disk image is copied per run: the guest boots it read-write.
env:
  HURD_IMG: https://cdimage.debian.org/cdimage/ports/latest/hurd-amd64/debian-hurd-amd64-20260314.img.tar.xz

jobs:
  hurd:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and GRUB tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 grub-pc-bin grub-common

      - name: Download the Debian GNU/Hurd image (cached)
        uses: actions/cache@v4
        with:
          path: hurd-image.tar.xz
          key: hurd-img-20260314

      - name: Fetch the image
        run: |
          [ -f hurd-image.tar.xz ] || curl -fsSL -o hurd-image.tar.xz "$HURD_IMG"
          tar xJf hurd-image.tar.xz
          qemu-img convert -O qcow2 debian-hurd-amd64-*.img hurd.qcow2

      - name: Build, test and smoke-test inside GNU/Hurd
        run: |
          sudo chmod 666 /dev/kvm || true
          python3 .github/scripts/hurd_vm.py \
            "$PWD/hurd.qcow2" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"

      - name: Show the serial console log on failure
        if: failure()
        run: cat serial.log 2>/dev/null || true
